name: CI

on:
  push:
    branches: [main]
    tags: ['v*']        # publish a GitHub Release when a v* tag is pushed
  pull_request:

concurrency:
  # A new main push supersedes the run in progress; the merge gate is the
  # newest commit's run only.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Cache-friendly build caps (rust-cache recommends no incremental); the
  # container gate carries the memory-specific ones.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUGINFO: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      # The grep/find tools resolve `rg` and `fd` via `which()` (upstream
      # `ensureTool`); ubuntu-latest ships neither, and apt names fd
      # `fdfind`.
      - name: Install rg and fd
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ripgrep fd-find
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd
      - name: Test
        run: cargo test --workspace -- --test-threads=4

  # The container gate checks this too (`.gate.sh`), but CI never did —
  # the cfg-fenced `ext-js` build went red once without anyone noticing.
  no-default-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Check without default features
        run: cargo check -p pi-coding-agent --no-default-features

  # rust-version = 1.97 (the oxc 0.158 transpile engine); stable CI can
  # silently accept code the declared floor would reject. Compile-compat
  # only — the stable test job carries behavior.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Check on MSRV
        run: cargo check --workspace --all-targets

  # The operator's daily driver is the release binary; build it here and
  # publish it as an artifact so a release-profile break is caught by CI
  # instead of by the next local run.
  release:
    if: github.ref_type != 'tag'   # tag pushes are handled by publish-release below
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release
          shared-key: workspace
      - name: Build release binary
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-linux-x86_64
          path: target/release/pi
          if-no-files-found: error

  # Build the exact four assets scripts/install.sh expects. Native runners
  # avoid cross-compiling quickjs-ng's C code; ubuntu-24.04-arm is GitHub's
  # hosted ARM runner. If that runner is unavailable for this private repo,
  # swap it for ubuntu-latest + taiki-e/install-action(tool: cross) and
  # `cross build --release --target aarch64-unknown-linux-gnu`.
  build-release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - runner: macos-13
            os: darwin
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: macos-14
            os: darwin
            arch: aarch64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target "${{ matrix.target }}"
      - name: Stage binary and checksum
        run: |
          mkdir -p dist
          asset="pi-${{ matrix.os }}-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/pi" "dist/$asset"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"
      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # One job creates/updates the Release so the four matrix jobs cannot race.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify we have four binaries and four checksums
        run: |
          set -eu
          for asset in pi-linux-x86_64 pi-linux-aarch64 \
                       pi-darwin-x86_64 pi-darwin-aarch64; do
            test -s "dist/$asset"
            test -s "dist/$asset.sha256"
          done
          ls -l dist
      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Advisory + license scan over the dependency tree; deliberately
  # non-blocking so an unmaintained-crate warning cannot strand pushes.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Deny check
        run: cargo deny check
