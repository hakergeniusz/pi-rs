[workspace]
resolver = "3"
members = [
	"crates/pi-schema",
	"crates/pi-ai",
	"crates/pi-agent",
	"crates/pi-tui",
	"crates/pi-mcp",
	"crates/pi-codemode",
	"crates/pi-coding-agent",
	"crates/pi-ext-js",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
authors = ["pi-rs contributors"]
repository = "https://github.com/hakergeniusz/pi-rs"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"time",
	"io-util",
	"signal",
	"fs",
	"process",
] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }

# coding-agent core
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
similar = "2"
globset = "0.4"
walkdir = "2"
regex = "1"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"

# internal crates
pi-schema = { path = "crates/pi-schema", version = "0.1.0-alpha.1" }
pi-ai = { path = "crates/pi-ai", version = "0.1.0-alpha.1" }
pi-agent = { path = "crates/pi-agent", version = "0.1.0-alpha.1" }
pi-tui = { path = "crates/pi-tui", version = "0.1.0-alpha.1" }
pi-mcp = { path = "crates/pi-mcp", version = "0.1.0-alpha.1" }
pi-codemode = { path = "crates/pi-codemode", version = "0.1.0-alpha.1" }
pi-ext-js = { path = "crates/pi-ext-js", version = "0.1.0-alpha.1" }

# extensions host (E0 spike)
rquickjs = { version = "0.14", features = ["loader", "parallel"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# style allowances for an async-heavy port
module_name_repetitions = "allow"
# terminal-cell and cost arithmetic saturates through bounded numeric round
# trips (cell grid dims, token counts); the cast lints are noise there
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
large_enum_variant = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
