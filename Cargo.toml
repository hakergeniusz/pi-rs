[workspace]
resolver = "3"
members = [
	"crates/pi-schema",
	"crates/pi-ai",
	"crates/pi-agent",
	"crates/pi-tui",
	"crates/pi-mcp",
	"crates/pi-codemode",
	"crates/pi-coding-agent",
	"crates/pi-ext-js",
	"crates/pi-env",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
authors = ["pi-rs contributors"]
repository = "https://github.com/hakergeniusz/pi-rs"
# The real floor: oxc 0.158 (the E1 transpile engine) requires 1.97; the
# 1.87 declaration predated the oxc bump and CI's MSRV job caught it.
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes `serde_json` parse long decimal tokens with correct
# rounding, matching V8's `JSON.parse` (the session store's load path). Without
# it the fast path can be one ULP off for ~17-digit literals, so a load/rewrite
# cycle would change bytes that pi itself preserves. See `session/json.rs`.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"time",
	"io-util",
	"signal",
	"fs",
	"process",
] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }

# coding-agent core
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
similar = "2"
globset = "0.4"
walkdir = "2"
regex = "1"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
# Pixel backend for the image pipeline (port of Photon's decode/Lanczos3
# resize/encode in utils/image-resize-core.ts). Only the codecs pi inlines
# plus BMP-for-conversion are enabled; all other decoders are left out.
image = { version = "0.25.10", default-features = false, features = [
	"png",
	"jpeg",
	"gif",
	"webp",
	"bmp",
] }

# internal crates
pi-schema = { path = "crates/pi-schema", version = "0.1.1" }
pi-ai = { path = "crates/pi-ai", version = "0.1.1" }
pi-agent = { path = "crates/pi-agent", version = "0.1.1" }
pi-tui = { path = "crates/pi-tui", version = "0.1.1" }
pi-mcp = { path = "crates/pi-mcp", version = "0.1.1" }
pi-codemode = { path = "crates/pi-codemode", version = "0.1.1" }
pi-ext-js = { path = "crates/pi-ext-js", version = "0.1.1" }

# extensions host (E0 spike)
rquickjs = { version = "0.14", features = ["loader", "parallel"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# style allowances for an async-heavy port
module_name_repetitions = "allow"
# terminal-cell and cost arithmetic saturates through bounded numeric round
# trips (cell grid dims, token counts); the cast lints are noise there
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
large_enum_variant = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
