[workspace]
resolver = "3"
members = [
	"crates/pi-schema",
	"crates/pi-ai",
	"crates/pi-agent",
	"crates/pi-tui",
	"crates/pi-mcp",
	"crates/pi-codemode",
	"crates/pi-coding-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["pi-rs contributors"]
repository = "https://github.com/hakergeniusz/pi-rs"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"time",
	"io-util",
	"signal",
	"fs",
	"process",
] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }

# internal crates
pi-schema = { path = "crates/pi-schema", version = "0.1.0" }
pi-ai = { path = "crates/pi-ai", version = "0.1.0" }
pi-agent = { path = "crates/pi-agent", version = "0.1.0" }
pi-tui = { path = "crates/pi-tui", version = "0.1.0" }
pi-mcp = { path = "crates/pi-mcp", version = "0.1.0" }
pi-codemode = { path = "crates/pi-codemode", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# style allowances for an async-heavy port
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
large_enum_variant = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
