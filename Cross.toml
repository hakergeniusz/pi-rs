# cross by default forwards only a small allowlist of environment variables.
# BSD bindgen needs the target sysroot argument inside the build container.
[build.env]
passthrough = [
    "BINDGEN_EXTRA_CLANG_ARGS",
    "BINDGEN_EXTRA_CLANG_ARGS_x86_64_unknown_freebsd",
    "BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_freebsd",
    "BINDGEN_EXTRA_CLANG_ARGS_x86_64_unknown_netbsd",
    "RUSTFLAGS",
]
