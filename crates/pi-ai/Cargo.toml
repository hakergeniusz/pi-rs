[package]
name = "pi-ai"
description = "Unified multi-provider LLM API with streaming (port of @earendil-works/pi-ai)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pi-schema = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
base64 = { workspace = true }
# The retry error patterns use lookarounds (`packages/ai/src/utils/retry.ts`),
# which the `regex` crate does not support. 0.14 mis-dispatches alternations
# that mix lookarounds with plain branches — 0.16.2 fixed it.
fancy-regex = "0.16"

[lints]
workspace = true
