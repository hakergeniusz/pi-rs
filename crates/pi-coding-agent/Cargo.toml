[package]
name = "pi-coding-agent"
description = "Pi coding agent CLI: sessions, built-in tools, extensions, modes (port of @earendil-works/pi-coding-agent)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pi_coding_agent"
path = "src/lib.rs"

[[bin]]
name = "pi"
path = "src/main.rs"

[dependencies]
pi-agent = { workspace = true }
pi-ai = { workspace = true }
pi-codemode = { workspace = true }
pi-mcp = { workspace = true }
pi-schema = { workspace = true }
pi-tui = { workspace = true }
# The embedded JS extensions host; build without it via `--no-default-features`.
pi-ext-js = { workspace = true, optional = true }
# Interactive mode polls terminal events directly, like the tui-demo host.
crossterm = { version = "0.29", default-features = false, features = ["events"] }
clap = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
similar = { workspace = true }
globset = { workspace = true }
walkdir = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["ext-js"]
ext-js = ["dep:pi-ext-js"]

[lints]
workspace = true
