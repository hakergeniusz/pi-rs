[package]
name = "pi-ext-js"
description = "Embedded JavaScript extensions host (E1 headless core; port target: the @earendil-works/pi-coding-agent extensions runtime)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rquickjs = { workspace = true, features = ["loader"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The native MCP server manager: connections run on a dedicated worker
# thread with its own runtime, since the engine thread may already be
# inside the process-wide tokio runtime.
tokio = { workspace = true }
pi-mcp = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
oxc_allocator = "0.158"
oxc_codegen = "0.158"
oxc_parser = "0.158"
oxc_semantic = "0.158"
oxc_span = "0.158"
oxc_transformer = "0.158"

# rquickjs ships pregenerated bindings for Linux/macOS/Windows only. BSD
# targets need bindgen at build time (libclang is present in the cross images).
[target.'cfg(any(target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

[target.'cfg(unix)'.dependencies]
# Signal-based exec termination (SIGTERM, then SIGKILL after the grace);
# std only offers SIGKILL via `Child::kill`.
nix = { version = "0.30", features = ["signal"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
