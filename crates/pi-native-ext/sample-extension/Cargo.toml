[package]
name = "pi-native-ext-sample-extension"
description = "Sample cdylib native extension used by pi-native-ext integration tests"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pi_native_ext_sample_extension"
crate-type = ["cdylib"]

[dependencies]
pi-native-ext = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The only unsafe here is `CString::from_raw` in the exported free shim, which
# mirrors an `into_raw` this same library performed. No workspace lint table is
# inherited so that this crate may export C symbols under edition 2024.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
large_enum_variant = "allow"
