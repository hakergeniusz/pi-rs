# Advisory + license scan for the `audit` CI job (non-blocking).
# Ground truth for the policy: the crates.io dependency tree only —
# std ships with rustc and is not scanned.

[advisories]
# cargo-deny >= 0.18 schema (PR #611): `vulnerability` is gone — RustSec
# vulnerabilities always fail the check; `unmaintained` takes a scope
# selector (all/workspace/transitive/none); `yanked` takes a level
# (deny/warn/allow).
# unmaintained = "none": chrono 0.4.x is flagged by RUSTSEC-2026-0543 and
# no safe upgrade exists; the advisory stands but must not fail the job.
unmaintained = "none"
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
