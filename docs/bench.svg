<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-label="Startup and memory comparison">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; fill: #cdd6f4; }
    .title { font-size: 15px; fill: #a6adc8; }
    .bar { fill: #89b4fa; }
    .bar2 { fill: #a6e3a1; }
    .label { fill: #bac2de; }
    .value { fill: #f9e2af; }
  </style>
  <rect width="760" height="230" fill="#11111b"/>
  <text x="20" y="28" class="title">First TUI frame (ms) - lower is better</text>
  <text x="20" y="58" class="label">pi-rs release</text>
  <rect x="170" y="46" width="205" height="16" class="bar" rx="3"/>
  <text x="382" y="58" class="value">~342 ms</text>
  <text x="20" y="84" class="label">pi-rs debug</text>
  <rect x="170" y="72" width="416" height="16" class="bar" rx="3"/>
  <text x="593" y="84" class="value">~694 ms</text>
  <text x="20" y="110" class="label">upstream pi (Node)</text>
  <rect x="170" y="98" width="39" height="16" class="bar2" rx="3"/>
  <text x="216" y="110" class="value">~65 ms</text>
  <text x="20" y="150" class="title">Resident set size (MiB) - lower is better</text>
  <text x="20" y="180" class="label">pi-rs release</text>
  <rect x="170" y="168" width="188" height="16" class="bar" rx="3"/>
  <text x="365" y="180" class="value">~32 MiB</text>
  <text x="20" y="206" class="label">upstream pi (Node)</text>
  <rect x="170" y="194" width="243" height="16" class="bar2" rx="3"/>
  <text x="420" y="206" class="value">~41 MiB</text>
</svg>
